<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Orbit Family & Friends</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><aside class="side" id="side"></aside><section class="main" id="main"></section><aside class="panel" id="panel"></aside></div>
<div id="call">
  <div class="chead" id="callHead"><span class="live"></span><span id="callTitle">In call</span><span style="flex:1"></span><button class="ib" id="cDock" title="Dock to the side of the chat"></button><button class="ib" id="cMin" title="Compact"></button><button class="ib" id="cMax" title="Larger"></button></div>
  <div class="tiles" id="tiles"></div>
  <div class="ctrl"><button id="bMic" title="Mute / unmute"></button><button id="bCam" title="Camera on / off"></button><button id="bScreen" title="Share your screen"></button><button id="bInv" title="Invite people to this call"></button><button class="end" id="callEnd" title="Leave call"></button></div>
</div>
<div id="ring"></div>
<div id="lb"></div>
<div id="toasts"></div><div id="pops"></div>
<script type="module" src="app.js"></script>
<nav id="mnav"></nav></body>
</html>
